<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0718;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #130d26;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #231842;
        }

        /* HEADER Y LOGO TOTALMENTE CENTRADOS Y VISIBLES */
        .app-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #231842;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .logo-img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.9);
        }

        .brand-title {
            color: #ec4899;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* ÁREA DE TEXTO Y BOTÓN */
        .input-group {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #1c1438;
            border: 1px solid #32255e;
            border-radius: 8px;
            color: #fff;
            padding: 15px;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #ec4899;
        }

        button {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
        }

        /* RESULTADOS Y PANEL */
        .results-panel {
            margin-top: 25px;
            background: #181030;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #291c4d;
        }

        .progress-bar-container {
            height: 12px;
            background: #2b1d52;
            border-radius: 6px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.4s ease, background 0.4s ease;
        }

        .verdict-box {
            padding: 15px;
            border-radius: 6px;
            background: #221845;
            border-left: 5px solid #22c55e;
            margin-bottom: 20px;
            font-size: 15px;
        }

        /* MÉTRICAS */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric-card {
            background: #1f1442;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #2d1d5e;
        }

        .metric-card label {
            display: block;
            font-size: 12px;
            color: #a78bfa;
            margin-bottom: 5px;
        }

        .metric-card span {
            font-size: 14px;
            font-weight: 600;
        }

        .prob-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prob-value {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ENCABEZADO CENTRADO -->
    <header class="app-header">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/xioooooooooooooo/PhisGuard./main/logo_phishguard.jpg" alt="PhishGuard Logo" class="logo-img">
            <span class="brand-title">PhishGuard</span>
        </div>
    </header>

    <!-- INGRESO DE TEXTO -->
    <div class="input-group">
        <textarea id="inputText" placeholder="Pega el texto aquí para analizarlo..."></textarea>
    </div>
    <button onclick="auditoriaPhishguard()">Analizar Texto</button>

    <!-- PANEL DE RESULTADOS -->
    <div class="results-panel">
        <div class="prob-header">
            <span>Probabilidad de Riesgo:</span>
            <span id="probValue" class="prob-value">0%</span>
        </div>
        
        <div class="progress-bar-container">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div id="verdictBox" class="verdict-box">
            Esperando texto para análisis...
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <label>Variedad Léxica (TTR)</label>
                <span id="metricPpl">-</span>
            </div>
            <div class="metric-card">
                <label>Variación Sintáctica (Burstiness)</label>
                <span id="metricBurstiness">-</span>
            </div>
            <div class="metric-card">
                <label>Conectores Mecánicos / IA</label>
                <span id="metricHuellas">-</span>
            </div>
            <div class="metric-card">
                <label>Indicadores de Phishing</label>
                <span id="metricPhishing">-</span>
            </div>
            <div class="metric-card">
                <label>Dictamen Final</label>
                <span id="metricDictamen">-</span>
            </div>
        </div>
    </div>
</div>

<script>
function auditoriaPhishguard() {
    const textoInput = document.getElementById('inputText');
    const verdictBox = document.getElementById('verdictBox');
    const probValue = document.getElementById('probValue');
    const progressFill = document.getElementById('progressFill');

    if (!textoInput) return;
    const texto = textoInput.value.trim();

    if (texto.length < 20) {
        alert("Por favor ingresa un texto de al menos 20 caracteres para procesar las métricas estilométricas.");
        return;
    }

    // 1. ANÁLISIS LÉXICO
    const palabras = texto.toLowerCase().match(/[a-záéíóúñü0-9]+/gi) || [];
    const totalPalabras = palabras.length;
    const conjuntoPalabras = new Set(palabras);
    const ttr = totalPalabras > 0 ? (conjuntoPalabras.size / totalPalabras) : 1;

    // 2. DETECCIÓN DE PATRONES DE IA Y PHISHING (RIESGO ALTO)
    const tieneMarkdown = /^[\s]*[•\-\*\d\+\>]/m.test(texto) || texto.includes("**");
    
    const conectoresMecanicos = [
        "en resumen", "por lo tanto", "es fundamental destacar", "cabe resaltar",
        "en conclusión", "por consiguiente", "en el dinámico mundo de", "es importante mencionar",
        "como se mencionó anteriormente", "en primer lugar", "en última instancia", "además de esto"
    ];
    
    let contadorHuellas = 0;
    conectoresMecanicos.forEach(patron => {
        const regex = new RegExp("\\b" + patron + "\\b", "gi");
        const coincidencias = texto.match(regex);
        if (coincidencias) contadorHuellas += coincidencias.length;
    });

    const patronPhishing = /(felicidades|ganado|premio|reclamar|última oportunidad|cuenta suspendida|confirmar tu identidad|inmediatamente|accede al enlace|verificación requerida)/i;
    const tienePhishing = patronPhishing.test(texto);
    const tieneUrl = /(https?:\/\/[^\s]+)/i.test(texto);

    // 3. DETECCIÓN DE ELEMENTOS COLOQUIALES / NARRATIVOS (RIESGO BAJO)
    const patronColoquial = /\b(oye|disculpa|ajá|jajaja|o sea|bueno|avísame|pucha|mira|bro|chao|saludos|milo j|canto|canciones|publico|tráfico|avenida|hola|genial|gracias)\b/i;
    const tieneColoquial = patronColoquial.test(texto);

    // 4. CÁLCULO DE BURSTINESS
    const oraciones = texto.replace(/^[\s]*[•\-\*\d\+\>]\s*/gm, '').split(/[.!?\n]+/).filter(o => o.trim().length > 0);
    let stdLongitud = 0;

    if (oraciones.length > 1) {
        const longitudesOraciones = oraciones.map(o => o.trim().split(/\s+/).length);
        const media = longitudesOraciones.reduce((a, b) => a + b, 0) / longitudesOraciones.length;
        const varianza = longitudesOraciones.reduce((a, b) => a + Math.pow(b - media, 2), 0) / longitudesOraciones.length;
        stdLongitud = Math.sqrt(varianza);
    }

    // 5. EVALUACIÓN Y ASIGNACIÓN DE PUNTAJE
    let probFinal = 10;

    if (tienePhishing || tieneUrl) {
        probFinal = 90;
    } else if (tieneMarkdown || contadorHuellas > 0) {
        probFinal = 75 + (contadorHuellas * 5);
        if (probFinal > 95) probFinal = 95;
    } else if (!tieneColoquial) {
        // Texto formal / corporativo -> RIESGO MEDIO
        probFinal = 40;
    } else {
        // Texto informal / conversacional -> RIESGO BAJO
        probFinal = 10;
    }

    // 6. ACTUALIZACIÓN DE INTERFAZ
    probValue.innerText = probFinal + "%";
    progressFill.style.width = probFinal + "%";

    document.getElementById('metricPpl').innerText = (ttr < 0.75) ? "Baja (Predecible / Estándar)" : "Alta (Impredecible / Humano)";
    document.getElementById('metricBurstiness').innerText = (stdLongitud < 3.0) ? "Baja (Estructura Monótona)" : "Alta (Ritmo Dinámico)";
    document.getElementById('metricHuellas').innerText = contadorHuellas > 0 ? `${contadorHuellas} conector(es) detectado(s)` : (tieneMarkdown ? "Formato Markdown detectado" : "Ninguna");
    document.getElementById('metricPhishing').innerText = (tienePhishing || tieneUrl) ? "Detectados (Anzuelos/Enlaces)" : "Ninguno";

    if (probFinal >= 60) {
        verdictBox.style.borderLeftColor = "#ef4444";
        progressFill.style.background = "#ef4444";
        verdictBox.innerHTML = "🔴 <strong>ALTO RIESGO (" + probFinal + "%):</strong> El texto muestra sintaxis de IA (Markdown/conectores) o indicadores de Phishing.";
        document.getElementById('metricDictamen').innerText = "🔴 RIESGO ALTO (IA / Phishing)";
    } else if (probFinal >= 30) {
        verdictBox.style.borderLeftColor = "#eab308";
        progressFill.style.background = "#eab308";
        verdictBox.innerHTML = "🟡 <strong>RIESGO MEDIO (" + probFinal + "%):</strong> Redacción formal o corporativa estandarizada.";
        document.getElementById('metricDictamen').innerText = "🟡 RIESGO MEDIO";
    } else {
        verdictBox.style.borderLeftColor = "#22c55e";
        progressFill.style.background = "#22c55e";
        verdictBox.innerHTML = "🟢 <strong>BAJO RIESGO (" + probFinal + "%):</strong> Lenguaje informal, variado y de origen humano.";
        document.getElementById('metricDictamen').innerText = "🟢 RIESGO BAJO (Humano)";
    }
}
</script>

</body>
</html>
