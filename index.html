<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard - Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f051d; color: #fce7f3; font-family: 'Space Grotesk', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: rgba(26, 9, 43, 0.8); border: 1px solid #831843; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        h1 { color: #ec4899; text-align: center; font-size: 2rem; }
        textarea { width: 100%; height: 180px; background: #1a092b; color: #fff; border: 1px solid #831843; border-radius: 8px; padding: 12px; font-size: 1rem; outline: none; }
        button { background: #db2777; color: #fff; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:hover { background: #be185d; }
        .verdict { padding: 15px; border-radius: 8px; background: #140524; border-left: 5px solid #831843; font-size: 1rem; font-weight: bold; }
        .progress-bar { height: 12px; background: #2a0c4e; border-radius: 6px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: #831843; transition: width 0.4s ease; }
        ul { list-style: none; display: flex; flex-direction: column; gap: 8px; background: #140524; padding: 15px; border-radius: 8px; font-size: 0.9rem; }
        ul li span { color: #f472b6; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ PhishGuard</h1>

    <div class="card">
        <label for="inputText">Ingresa el texto a evaluar:</label>
        <textarea id="inputText" placeholder="Pega un mensaje o fragmento aquí..."></textarea>
        <!-- Disparo directo onclick -->
        <button onclick="auditoriaPhishguard()">Analizar Texto</button>
    </div>

    <div class="card">
        <div id="verdictBox" class="verdict">Esperando texto para analizar...</div>

        <div>
            <p style="margin-bottom: 5px;">Índice Estimado de IA: <strong id="probValue">0%</strong></p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <ul>
            <li>Dictamen: <span id="metricDictamen">-</span></li>
            <li>Perplejidad: <span id="metricPpl">-</span></li>
            <li>Ráfaga Sintáctica (Burstiness): <span id="metricBurstiness">-</span></li>
            <li>Estructura / Formato: <span id="metricEmbeddings">-</span></li>
            <li>Alertas / Phishing: <span id="metricMuletillas">-</span></li>
        </ul>
    </div>
</div>

<script>
function auditoriaPhishguard() {
    const texto = document.getElementById('inputText').value.trim();
    const verdictBox = document.getElementById('verdictBox');
    const probValue = document.getElementById('probValue');
    const progressFill = document.getElementById('progressFill');

    if (texto.length < 15) {
        alert("Por favor ingresa un texto de al menos 15 caracteres.");
        return;
    }

    // Análisis de métricas
    const palabras = texto.split(/\s+/).filter(p => p.length > 0);
    const oraciones = texto.split(/[.!?\n]+/).filter(o => o.trim().length > 0);
    const longitudes = oraciones.map(o => o.trim().split(/\s+/).length);

    // Burstiness (Desviación estándar de oraciones)
    const media = longitudes.reduce((a, b) => a + b, 0) / Math.max(longitudes.length, 1);
    const varianza = longitudes.reduce((a, b) => a + Math.pow(b - media, 2), 0) / Math.max(longitudes.length, 1);
    const stdLongitud = Math.sqrt(varianza);

    // Detección de patrones
    const tieneVineta = /^[\s]*[•\-\*\d\+\>]/m.test(texto);
    const tieneNegrita = texto.includes("**");
    const tienePhishing = /(felicidades|ganado|premio|reclamar|última oportunidad|cancelado|confirmar tu identidad|accede al enlace|inmediatamente)/i.test(texto);
    const tieneUrl = /(https?:\/\/[^\s]+)/i.test(texto);
    const conectoresIa = /(en conclusión|por lo tanto|es fundamental destacar|en resumen|cabe resaltar|por consiguiente)/gi;
    const tieneConectores = conectoresIa.test(texto);

    // Puntaje
    let score = 20;
    if (stdLongitud < 3.0 && oraciones.length > 1) score += 25;
    if (tieneVineta) score += 20;
    if (tieneNegrita) score += 15;
    if (tieneConectores) score += 20;
    if (tienePhishing) score += 25;
    if (tieneUrl) score += 20;

    const prob = Math.min(99, Math.max(1, Math.round(score)));

    // Actualizar Interfaz
    probValue.innerText = prob + "%";
    progressFill.style.width = prob + "%";

    document.getElementById('metricPpl').innerText = stdLongitud < 3.0 ? "Baja (Predecible)" : "Alta (Variada)";
    document.getElementById('metricBurstiness').innerText = stdLongitud < 3.0 ? "Monótona" : "Dinámica";
    document.getElementById('metricEmbeddings').innerText = (tieneVineta || tieneNegrita) ? "Sintética (Markdown)" : "Orgánica";
    document.getElementById('metricMuletillas').innerText = (tieneConectores || tienePhishing) ? "Detectadas" : "Ninguna";

    if (prob >= 65) {
        verdictBox.style.borderLeftColor = "#ef4444";
        progressFill.style.background = "#ef4444";
        verdictBox.innerHTML = "🔴 RIESGO ALTO (" + prob + "%): Contenido con patrones sintéticos, estructura rígida o anzuelos de phishing.";
        document.getElementById('metricDictamen').innerText = "🔴 RIESGO ALTO";
    } else if (prob >= 35) {
        verdictBox.style.borderLeftColor = "#eab308";
        progressFill.style.background = "#eab308";
        verdictBox.innerHTML = "🟡 RIESGO MEDIO (" + prob + "%): Texto con estructura mixta o redacción formal asistida.";
        document.getElementById('metricDictamen').innerText = "🟡 RIESGO MEDIO";
    } else {
        verdictBox.style.borderLeftColor = "#22c55e";
        progressFill.style.background = "#22c55e";
        verdictBox.innerHTML = "🟢 RIESGO BAJO (" + prob + "%): Redacción orgánica propia de autoría humana.";
        document.getElementById('metricDictamen').innerText = "🟢 RIESGO BAJO";
    }
}
</script>

</body>
</html>
